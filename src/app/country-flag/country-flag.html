<div class="postcard-page">

  <div class="page-header">
    <a routerLink="/" class="brand-bar" aria-label="World Atlas home">
      <svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4"/>
        <path d="M50 8 L58 46 L50 54 L42 46 Z" fill="currentColor"/>
        <path d="M50 92 L58 54 L50 46 L42 54 Z" fill="currentColor" opacity="0.5"/>
      </svg>
      <span>World Atlas</span>
    </a>
    <button
      type="button"
      class="theme-toggle"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="!themeService.isDark()" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="themeService.isDark()" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M50 8 L58 46 L50 54 L42 46 Z" fill="currentColor"/>
    <path d="M50 92 L58 54 L50 46 L42 54 Z" fill="currentColor" opacity="0.4"/>
    <path d="M8 50 L46 42 L54 50 L46 58 Z" fill="currentColor" opacity="0.25"/>
    <path d="M92 50 L54 42 L46 50 L54 58 Z" fill="currentColor" opacity="0.25"/>
  </svg>

  <div class="loading-card" *ngIf="loading()" aria-live="polite" aria-label="Loading">
    <div class="globe-loader"></div>
    <p class="loading-text">Spinning the globe...</p>
  </div>

  <div class="postcard-stack" *ngIf="!loading()">
    <div class="postcard">
      <div class="postcard-flag-frame" *ngIf="flagUrl()">
        <img [src]="flagUrl()" alt="{{ countryName }} flag" class="flag-img">
        <div class="stamp-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Found</span>
        </div>
      </div>

      <p class="error-msg" *ngIf="!flagUrl() && errorMsg()">{{ errorMsg() }}</p>

      <h1 class="country-name">{{ countryName }}</h1>

      <div class="action-row" *ngIf="flagUrl()">
        <a [routerLink]="['/details', countryName]" class="details-btn">
          View Details
        </a>
        <a routerLink="/" class="back-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </a>
      </div>

      <a routerLink="/" class="back-btn" *ngIf="!flagUrl()">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </a>
    </div>
  </div>

</div>
