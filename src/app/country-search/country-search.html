<div class="atlas-page">
  <div class="page-header">
    <a routerLink="/" class="brand-bar" aria-label="World Atlas home">
      <svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4"/>
        <path d="M50 8 L58 46 L50 54 L42 46 Z" fill="currentColor"/>
        <path d="M50 92 L58 54 L50 46 L42 54 Z" fill="currentColor" opacity="0.5"/>
      </svg>
      <span>World Atlas</span>
    </a>
    <button
      type="button"
      class="theme-toggle"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="!themeService.isDark()" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="themeService.isDark()" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M50 8 L58 46 L50 54 L42 46 Z" fill="currentColor"/>
    <path d="M50 92 L58 54 L50 46 L42 54 Z" fill="currentColor" opacity="0.4"/>
    <path d="M8 50 L46 42 L54 50 L46 58 Z" fill="currentColor" opacity="0.25"/>
    <path d="M92 50 L54 42 L46 50 L54 58 Z" fill="currentColor" opacity="0.25"/>
  </svg>

  <div class="atlas-card">
    <span class="eyebrow">World Atlas</span>
    <h1>Which country are<br>you curious about?</h1>
    <p class="subtitle">Search any country for its flag, facts, and neighbours.</p>

    <form (ngSubmit)="onSubmit()" class="search-form" novalidate>
            <div class="field-wrap">
        <div class="field">
          <label for="countryName">Country name</label>
          <input
            id="countryName"
            type="text"
            [(ngModel)]="countryName"
            (ngModelChange)="onInputChange()"
            (keydown)="onKeyDown($event)"
            (blur)="closeSuggestions()"
            name="countryName"
            placeholder="e.g. Pakistan"
            autocomplete="off"
            required>
        </div>

        <ul class="suggestions" *ngIf="showSuggestions()">
          <li *ngFor="let name of suggestions(); let i = index">
            <button
              type="button"
              [class.active]="i === activeIndex()"
              (mousedown)="$event.preventDefault(); selectSuggestion(name)">
              {{ name }}
            </button>
          </li>
        </ul>
      </div>

      <button type="submit" class="stamp-btn" [disabled]="isNavigating()">
        <span>{{ isNavigating() ? 'Finding...' : 'Find' }}</span>
        <svg *ngIf="!isNavigating()" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <div class="recent-searches" *ngIf="recentSearches().length > 0">
      <div class="recent-header">
        <span class="recent-label">Recently searched</span>
        <button type="button" class="clear-all-btn" (click)="clearAllRecent()">
          Clear all
        </button>
      </div>
      <div class="recent-chips">
        <button
          type="button"
          class="chip"
          *ngFor="let country of recentSearches()"
          (click)="searchRecent(country)"
          [disabled]="isNavigating()">
          <span>{{ country }}</span>
          <span
            class="chip-remove"
            (click)="removeRecentSearch(country, $event)"
            aria-label="Remove">×</span>
        </button>
      </div>
    </div>
  </div>

  <p class="page-footer">Flags, facts, and borders — all in one place</p>
</div>
